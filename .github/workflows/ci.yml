name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akit
          POSTGRES_PASSWORD: akit
          POSTGRES_DB: akit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U akit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://akit:akit@localhost:5433/akit
    steps:
      - uses: actions/checkout@v7
      # No `version:` on purpose — package.json's `packageManager` is the single
      # source of truth. action-setup@v4 refuses when both declare a version,
      # which failed CI at its very first step: nothing was ever verified.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @assessment-kit/storage-postgres migrate
      - run: pnpm test
      - run: pnpm protocols:validate   # demo protocols must pass the schema
      # Layering lint (ADR-006): framework packages must stay domain-agnostic.
      # Single source of truth is the root package.json script — same check
      # runs locally via `pnpm verify`.
      - name: layering lint
        run: pnpm lint:layering
      # Dependency vulnerabilities. Non-blocking for now (|| true) so a fresh
      # advisory doesn't wall off unrelated work; tighten to a hard gate once
      # the backlog's noise level is known. Pairs with .github/dependabot.yml.
      - name: dependency audit
        run: pnpm audit --audit-level=high || true
