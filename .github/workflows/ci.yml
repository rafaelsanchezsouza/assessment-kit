name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gaf
          POSTGRES_PASSWORD: gaf
          POSTGRES_DB: gaf
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gaf:gaf@localhost:5433/gaf
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gaf/storage-postgres migrate
      - run: pnpm test
      - run: pnpm protocols:validate   # demo protocols must pass the schema
      # Layering lint (ADR-006): framework packages must stay domain-agnostic.
      # Domain knowledge arrives only as data; demo data in catalog/ and
      # apps/prototype/ is the sanctioned exception, so only packages/ is swept.
      - name: layering lint
        run: |
          if grep -riEn 'nativa|nbs|paraiba|paraíba' packages/ --include='*.ts' --include='*.tsx' --include='*.json' --include='*.sql' --include='*.md'; then
            echo '::error::domain identifiers found in framework packages (see ADR-006)'
            exit 1
          fi
