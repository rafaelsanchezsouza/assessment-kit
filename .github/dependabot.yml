version: 2
updates:
  # npm/pnpm dependency updates across the monorepo. Grouped so security-relevant
  # bumps land as reviewable PRs once the repo is pushed to GitHub (a founder
  # pendency — see nativa-domain/docs/proximos-passos.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
