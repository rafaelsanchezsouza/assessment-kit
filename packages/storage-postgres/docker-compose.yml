# Local dev/test Postgres for @gaf/storage-postgres only.
# Isolated from the shared VM's evolution-api Postgres (see ../../../DEPLOY-PLAYBOOK.md §2).
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # host 5433, per DEPLOY-PLAYBOOK's "Postgres próprio 5433+" convention
    environment:
      POSTGRES_USER: gaf
      POSTGRES_PASSWORD: gaf
      POSTGRES_DB: gaf
    volumes:
      - gaf_storage_postgres_data:/var/lib/postgresql/data
volumes:
  gaf_storage_postgres_data:
